name: Deploy THE UNIVERSE to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "THE_UNIVERSE_PACKAGE_03/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: THE_UNIVERSE_PACKAGE_03
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        working-directory: THE_UNIVERSE_PACKAGE_03
        run: node --test tests/package-03.test.mjs tests/celestial-catalog.test.mjs

      - name: Run lint
        working-directory: THE_UNIVERSE_PACKAGE_03
        run: npm run lint

      - name: Run typecheck
        working-directory: THE_UNIVERSE_PACKAGE_03
        run: npm run typecheck

      - name: Build static website
        working-directory: THE_UNIVERSE_PACKAGE_03
        env:
          NEXT_PUBLIC_BASE_PATH: /the-universe
          NEXT_PUBLIC_SITE_URL: https://thaodamvc2-beep.github.io/the-universe/
        run: npm run build

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: THE_UNIVERSE_PACKAGE_03/apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
