name: Deploy THE UNIVERSE to GitHub Pages

on:
  push:
    branches: ["main", "fix/mobile-desktop-flight-landing-ui"]
    paths:
      - "apps/web/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/static.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run package regression tests
        run: node --test tests/package-03.test.mjs tests/celestial-catalog.test.mjs tests/guest-identity.test.mjs tests/cosmic-map.test.mjs tests/spaceflight.test.mjs
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
      - name: Build static website
        env:
          NEXT_PUBLIC_BASE_PATH: /the-universe
          NEXT_PUBLIC_SITE_URL: https://thaodamvc2-beep.github.io/the-universe/
        run: npm run build
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5

# Ensure CI runs against the restored integrated source tree.
